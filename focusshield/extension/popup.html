<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>FocusShield</title>
    <style>
        body {
            width: 280px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 14px;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 10px;
        }

        button,
        select {
            width: 100%;
            margin-top: 8px;
            padding: 9px;
        }

        .status {
            margin: 10px 0;
            font-size: 13px;
            opacity: 0.8;
        }

        .danger {
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <h1>🛡 FocusShield</h1>

    <div id="status" class="status">Loading...</div>

    <select id="preset">
        <option value="social">Social</option>
        <option value="video">Video</option>
        <option value="news">News</option>
    </select>

    <select id="duration">
        <option value="25">25 minutes</option>
        <option value="50">50 minutes</option>
        <option value="90">90 minutes</option>
        <option value="120">2 hours</option>
    </select>

    <label>
        <input id="locked" type="checkbox" checked />
        Locked mode
    </label>

    <button id="start">Activate Shield</button>
    <button id="stop">Stop Shield</button>

    <script src="popup.js"></script>
</body>

</html>
