name: Apply tab music quality patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-tab-music-quality.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/patch-tab-music-quality.mjs
      - run: npm ci
      - run: npx vite build
      - run: git diff --check
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Improve shared tab music audio quality
          file_pattern: src/pages/RoomPageLiveKit.tsx
