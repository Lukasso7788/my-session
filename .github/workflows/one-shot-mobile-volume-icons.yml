name: One-shot mobile volume icons

on:
  push:
    paths:
      - .github/workflows/one-shot-mobile-volume-icons.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add supplied volume icons
        shell: bash
        run: |
          cat > public/icons/volume-up.svg <<'SVG'
          <svg fill="none" height="512" viewBox="0 0 20 20" width="512" xmlns="http://www.w3.org/2000/svg"><path clip-rule="evenodd" d="m9.383 3.07602c.18269.07574.33881.20395.44863.36842.10983.16447.16837.35781.16837.55558v11.99998c-.00004.1978-.05871.3911-.1686.5555-.10988.1644-.26605.2925-.44875.3682s-.38373.0955-.57768.0569-.37212-.1338-.51197-.2736l-3.707-3.707h-2.586c-.26522 0-.51957-.1053-.70711-.2929-.18753-.1875-.29289-.4419-.29289-.7071v-3.99998c0-.26522.10536-.51957.29289-.70711.18754-.18754.44189-.29289.70711-.29289h2.586l3.707-3.707c.13985-.13994.31805-.23524.51208-.27387.19402-.03863.39515-.01884.57792.05687zm5.274-.147c.1875-.18747.4418-.29279.707-.29279s.5195.10532.707.29279c.9298.92765 1.6672 2.02985 2.1699 3.24331.5026 1.21345.7606 2.51425.7591 3.82767.0015 1.3135-.2565 2.6143-.7591 3.8277-.5027 1.2135-1.2401 2.3157-2.1699 3.2433-.1886.1822-.4412.283-.7034.2807s-.513-.1075-.6984-.2929-.2906-.4362-.2929-.6984.0985-.5148.2807-.7034c.7441-.7419 1.3342-1.6237 1.7363-2.5945.4022-.9709.6083-2.0117.6067-3.0625 0-2.20998-.894-4.20798-2.343-5.65698-.1875-.18753-.2928-.44184-.2928-.707 0-.26517.1053-.51948.2928-.707zm-2.829 2.828c.0929-.09298.2032-.16674.3246-.21706.1214-.05033.2515-.07623.3829-.07623s.2615.0259.3829.07623c.1214.05032.2317.12408.3246.21706.5579.55666 1.0003 1.21806 1.3018 1.94621.3015.72814.4562 1.50868.4552 2.29677.001.7881-.1537 1.5686-.4553 2.2968-.3015.7281-.7439 1.3895-1.3017 1.9462-.1876.1877-.4421.2931-.7075.2931s-.5199-.1054-.7075-.2931c-.1876-.1876-.2931-.4421-.2931-.7075 0-.2653.1055-.5198.2931-.7075.3722-.3708.6673-.8116.8685-1.2969.2011-.4854.3043-1.0057.3035-1.5311.0008-.52537-.1023-1.04572-.3035-1.53107-.2011-.48536-.4963-.92612-.8685-1.29691-.093-.09288-.1667-.20316-.2171-.32456-.0503-.1214-.0762-.25153-.0762-.38294 0-.13142.0259-.26155.0762-.38294.0504-.1214.1241-.23169.2171-.32456z" fill="#2F2F2F" fill-rule="evenodd"/></svg>
          SVG

          cat > public/icons/volume.svg <<'SVG'
          <svg fill="none" height="512" viewBox="0 0 20 20" width="512" xmlns="http://www.w3.org/2000/svg"><g clip-rule="evenodd" fill="#2F2F2F" fill-rule="evenodd"><path d="m9.38268 3.07615c.37368.15478.61732.51942.61732.92388v11.99997c0 .4045-.24364.7691-.61732.9239-.37367.1548-.80379.0692-1.08979-.2168l-3.7071-3.7071h-2.58579c-.55228 0-1-.4477-1-1v-3.99997c0-.55229.44772-1 1-1h2.58579l3.7071-3.70711c.286-.286.71612-.37155 1.08979-.21677z"/><path d="m12.2929 7.29289c.3905-.39052 1.0237-.39052 1.4142 0l1.2929 1.2929 1.2929-1.2929c.3905-.39052 1.0237-.39052 1.4142 0 .3905.39053.3905 1.02369 0 1.41422l-1.2929 1.29289 1.2929 1.2929c.3905.3905.3905 1.0237 0 1.4142s-1.0237.3905-1.4142 0l-1.2929-1.2929-1.2929 1.2929c-.3905.3905-1.0237.3905-1.4142 0s-.3905-1.0237 0-1.4142l1.2929-1.2929-1.2929-1.29289c-.3905-.39053-.3905-1.02369 0-1.41422z"/></g></svg>
          SVG

      - name: Patch top bar music mute button
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/RoomTopBar.tsx')
          text = path.read_text()

          replacement = r'''function MusicVolumeIcon({
              muted,
              isLight,
              className = "w-5 h-5",
          }: {
              muted: boolean;
              isLight: boolean;
              className?: string;
          }) {
              return (
                  <img
                      src={muted ? "/icons/volume.svg" : "/icons/volume-up.svg"}
                      alt=""
                      className={`${className} object-contain ${isLight ? "" : "brightness-0 invert"}`}
                      draggable={false}
                      aria-hidden="true"
                  />
              );
          }

          export default function RoomTopBar'''

          text, count = re.subn(
              r'function MusicRadioIcon\(\{.*?\n\}\n\nexport default function RoomTopBar',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected MusicRadioIcon block once, replaced {count}')

          old_class = '"lg:hidden flex h-[32px] w-[32px] shrink-0 items-center justify-center rounded-full border transition",'
          new_class = '"lg:hidden flex h-[32px] w-[84px] max-[480px]:w-[78px] shrink-0 items-center justify-center rounded-full border transition",'
          if old_class not in text:
              raise SystemExit('mobile music button size class not found')
          text = text.replace(old_class, new_class, 1)

          old_icon = '<MusicRadioIcon muted={mobileMusicState.muted} className="h-[18px] w-[18px]" />'
          new_icon = '<MusicVolumeIcon muted={mobileMusicState.muted} isLight={isLight} className="h-[20px] w-[20px]" />'
          if old_icon not in text:
              raise SystemExit('old music icon usage not found')
          text = text.replace(old_icon, new_icon, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit feature and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-mobile-volume-icons.yml
          git add src/components/RoomTopBar.tsx public/icons/volume-up.svg public/icons/volume.svg
          git commit -m "Use volume icons for mobile music mute"
          git push origin HEAD:main
