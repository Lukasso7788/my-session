name: Apply camera mirror sync

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-camera-mirror-sync.mjs
      - .github/workflows/apply-camera-mirror-sync.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run camera mirror patch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply mirror patch
        id: patch
        continue-on-error: true
        run: |
          node scripts/apply-camera-mirror-sync.mjs > /tmp/camera-mirror-patch.log 2>&1
          status=$?
          cat /tmp/camera-mirror-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Persist patch failure
        if: steps.patch.outputs.status != '0'
        run: |
          cp /tmp/camera-mirror-patch.log camera-mirror-patch-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camera-mirror-patch-error.txt
          git commit -m "Record camera mirror patch error"
          git push origin HEAD:main
          exit 1

      - name: Install dependencies
        if: steps.patch.outputs.status == '0'
        run: npm ci

      - name: Build
        if: steps.patch.outputs.status == '0'
        run: npm run build

      - name: Commit implementation
        if: steps.patch.outputs.status == '0'
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/RoomPageLiveKit.tsx \
            src/pages/livekit/VideoTileLiveKitLegacy.tsx \
            src/pages/livekit/LiveKitBottomBarLegacy.tsx \
            src/pages/livekit/LiveKitBottomBar.tsx \
            src/pages/livekit/RoomSettingsModalLiveKit.tsx
          git commit -m "Sync camera mirror preference across room"
          git push origin HEAD:main
