name: Patch stage bar length and drawer cancel icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-stagebar-length-cancel-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch SessionCard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SessionCard.tsx')
          text = path.read_text()

          old_class = 'className="w-full min-w-0 px-0 min-[1024px]:flex-1"'
          new_class = 'className="w-full min-w-0 px-0 min-[1024px]:flex-1 min-[1024px]:pr-[15%]"'

          old_cancel_class = 'className="h-11 w-full rounded-full border border-[#F65252] bg-[#FFF7F7] text-[13px] font-semibold text-[#D83F3F] transition hover:bg-[#FFEDED]"'
          new_cancel_class = 'className="h-11 w-full rounded-full border border-[#F65252] bg-[#FFF7F7] text-[13px] font-semibold text-[#D83F3F] transition hover:bg-[#FFEDED] flex items-center justify-center gap-2"'

          old_cancel_text = '>\n                                    Cancel my booking\n                                </button>'
          new_cancel_text = '>\n                                    <IconCancel size={17} />\n                                    Cancel my booking\n                                </button>'

          if old_class not in text:
              raise SystemExit('session card timeline wrapper class not found')
          if old_cancel_class not in text:
              raise SystemExit('drawer cancel booking class not found')

          cancel_pos = text.find(old_cancel_class)
          text = text.replace(old_class, new_class, 1)
          text = text.replace(old_cancel_class, new_cancel_class, 1)

          tail = text[cancel_pos:cancel_pos + 700]
          if old_cancel_text not in tail:
              raise SystemExit('drawer cancel booking text block not found')
          tail = tail.replace(old_cancel_text, new_cancel_text, 1)
          text = text[:cancel_pos] + tail + text[cancel_pos + 700:]

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SessionCard.tsx
          git commit -m 'Polish session stage bar length and cancel booking action' || exit 0
          git push origin main
