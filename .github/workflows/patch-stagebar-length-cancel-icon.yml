name: Patch stage bar length and drawer cancel icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-stagebar-length-cancel-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch SessionCard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SessionCard.tsx')
          text = path.read_text()

          old_timeline = '''                                        <div className="w-full min-w-0 px-0 min-[1024px]:flex-1">
                        {cardStages.length > 0 ? (
                            <SessionStageBar
                                stages={cardStages}
                                startTime={timelineStartTime}
                                cycleSeconds={cycleSeconds}
                                progressStyle="tick"
                                tickEveryMs={tickEveryMs}
                                theme="light"
                            />
                        ) : (
                            <div
                                className="h-[10px] w-full rounded-full bg-[#E7E7E7]"
                                aria-label="Session timeline"
                            />
                        )}
                    </div>'''

          new_timeline = '''                                        <div className="w-full min-w-0 px-0 min-[1024px]:flex-1">
                        <div className="w-full min-[1024px]:w-[85%]">
                            {cardStages.length > 0 ? (
                                <SessionStageBar
                                    stages={cardStages}
                                    startTime={timelineStartTime}
                                    cycleSeconds={cycleSeconds}
                                    progressStyle="tick"
                                    tickEveryMs={tickEveryMs}
                                    theme="light"
                                />
                            ) : (
                                <div
                                    className="h-[10px] w-full rounded-full bg-[#E7E7E7]"
                                    aria-label="Session timeline"
                                />
                            )}
                        </div>
                    </div>'''

          old_cancel = '''                                    className="h-11 w-full rounded-full border border-[#F65252] bg-[#FFF7F7] text-[13px] font-semibold text-[#D83F3F] transition hover:bg-[#FFEDED]"
                                >
                                    Cancel my booking
                                </button>'''

          new_cancel = '''                                    className="h-11 w-full rounded-full border border-[#F65252] bg-[#FFF7F7] text-[13px] font-semibold text-[#D83F3F] transition hover:bg-[#FFEDED] flex items-center justify-center gap-2"
                                >
                                    <IconCancel size={17} />
                                    Cancel my booking
                                </button>'''

          if old_timeline not in text:
              raise SystemExit('session card timeline block not found')
          if old_cancel not in text:
              raise SystemExit('drawer cancel booking button not found')

          text = text.replace(old_timeline, new_timeline, 1)
          text = text.replace(old_cancel, new_cancel, 1)
          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SessionCard.tsx
          git commit -m 'Polish session stage bar length and cancel booking action' || exit 0
          git push origin main
