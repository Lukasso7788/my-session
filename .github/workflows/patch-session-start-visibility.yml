name: Patch strict session start visibility

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-session-start-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch start-state logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SessionCard.tsx')
          text = path.read_text()
          old = '''    const hasStarted = useMemo(() => {
              if (isInfinite) return true;
              if (liveNowCount > 0) return true;

              if (!session?.start_time) return false;
              const t = Date.parse(String(session.start_time));
              if (!Number.isFinite(t)) return false;
              return Date.now() >= t;
          }, [isInfinite, liveNowCount, session?.start_time]);'''
          new = '''    const hasStarted = useMemo(() => {
              if (isInfinite) return true;

              const status = safeLower(session?.status);
              if (
                  status === "active" ||
                  status === "live" ||
                  status === "started" ||
                  status === "in_progress"
              ) {
                  return true;
              }

              if (!session?.start_time) return false;
              const t = Date.parse(String(session.start_time));
              if (!Number.isFinite(t)) return false;
              return Date.now() >= t;
          }, [isInfinite, session?.status, session?.start_time]);'''
          if old not in text:
              raise SystemExit('hasStarted block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx vite build
      - run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SessionCard.tsx
          git commit -m "Show live occupancy only after session starts"
          git push origin main
