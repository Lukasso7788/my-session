name: Apply tab music V2 patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-tab-music-v2.mjs
      - .github/workflows/apply-tab-music-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/patch-tab-music-v2.mjs
      - run: npm ci
      - run: npx vite build
      - run: git diff --check
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Route shared tab music directly at high quality
          file_pattern: src/pages/RoomPageLiveKit.tsx
