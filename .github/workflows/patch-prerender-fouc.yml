name: Patch prerender flash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-prerender-fouc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prevent prerender SEO content flash before React mounts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/prerender-seo.mjs')
          text = path.read_text()

          old = "  return html.replace('<div id=\"root\"></div>', `<div id=\"root\">${renderVisibleContent(page)}</div>`);\n"
          new = '''  const prerenderContent = renderVisibleContent(page);\n  const clearPrerenderBeforePaint = '<script id="seo-prerender-clear">(function(){var root=document.getElementById("root");if(root)root.innerHTML="";})();</script>';\n  return html.replace(\n    '<div id="root"></div>',\n    `<div id="root">${prerenderContent}</div>${clearPrerenderBeforePaint}`,\n  );\n'''

          if old not in text:
              raise SystemExit('prerender root replacement anchor not found')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Verify prerender guard
        shell: bash
        run: |
          grep -q 'id="seo-prerender-clear"' dist/index.html
          python - <<'PY'
          from pathlib import Path
          html = Path('dist/index.html').read_text()
          root = html.find('<div id="root">')
          guard = html.find('id="seo-prerender-clear"')
          module = html.find('type="module"')
          if root < 0 or guard < 0 or module < 0:
              raise SystemExit('missing prerender root, guard, or module script')
          if not (root < guard < module):
              raise SystemExit('prerender clear guard is not placed before the module bundle')
          PY
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prerender-seo.mjs
          git commit -m 'Prevent prerender SEO content flash on page load' || exit 0
          git push origin main
