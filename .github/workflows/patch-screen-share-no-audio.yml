name: Disable audio for regular screen share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-screen-share-no-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Disable audio capture for regular screen share only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/RoomPageLiveKit.tsx')
          text = path.read_text()

          pattern = re.compile(r'(await lp\.setScreenShareEnabled\(true, \{\n\s*)audio: true,')
          matches = list(pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'expected 2 regular screen-share audio=true blocks, found {len(matches)}')

          text = pattern.sub(r'\1audio: false,', text)

          if "const SHARED_TAB_MUSIC_TRACK_NAME = \"shared_tab_music\";" not in text:
              raise SystemExit('shared tab music marker missing')
          if "navigator.mediaDevices.getDisplayMedia({" not in text:
              raise SystemExit('shared tab music display capture missing')
          if "audio: canSuppressLocalTabPlayback" not in text:
              raise SystemExit('shared tab music audio capture was unexpectedly changed')

          remaining_regular_audio = re.findall(
              r'await lp\.setScreenShareEnabled\(true, \{\n\s*audio: true,',
              text,
          )
          if remaining_regular_audio:
              raise SystemExit('regular screen share still requests audio')

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production Vite build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/RoomPageLiveKit.tsx
          git commit -m 'Disable audio capture for regular screen share' || exit 0
          git push origin main
