name: Apply Free Flow picker integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-free-flow-intro.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply prepared integration
        run: node scripts/apply-free-flow-intro.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit integrated picker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-free-flow-intro.mjs scripts/free-flow-intro.next.css
          git add src/pages/RoomPageLiveKit.tsx src/free-flow-intro.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Implement Free Flow structure picker"
          git push origin HEAD:main

# Triggered after reconnecting the GitHub connector.
