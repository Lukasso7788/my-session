name: Patch session card stage timeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-session-card-stage-timeline.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary session-card stage timeline patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch session card timeline layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          card_path = Path('src/components/SessionCard.tsx')
          bar_path = Path('src/components/SessionStageBar.tsx')

          card = card_path.read_text()
          bar = bar_path.read_text()

          old = '''    const timelineStartTime = useMemo(() => {
              const startedAt = session?.started_at;
              const startTime = session?.start_time;
              const createdAt = session?.created_at;

              const start = startedAt || startTime || createdAt || "";
              if (!start) return String(Date.now());

              if (!startedAt && startTime) {
                  const ms = Date.parse(String(startTime));
                  if (Number.isFinite(ms) && ms > Date.now()) return String(Date.now());
              }

              return String(start);
          }, [session?.start_time, session?.started_at, session?.created_at]);'''
          new = '''    const timelineStartTime = useMemo(() => {
              const startedAt = session?.started_at;
              const startTime = session?.start_time;
              const createdAt = session?.created_at;
              const start = startedAt || startTime || createdAt || "";

              return start ? String(start) : String(Date.now());
          }, [session?.start_time, session?.started_at, session?.created_at]);'''
          if old not in card:
              raise SystemExit('timelineStartTime block not found')
          card = card.replace(old, new, 1)

          marker = '    const tickEveryMs = isInfinite ? 15000 : 1000;\n'
          if marker not in card:
              raise SystemExit('tickEveryMs marker not found')

          card_stages = r'''

    // Session cards should show the stage timeline by default without creating
    // a per-card PostgREST fetch. Build it only from data already present on
    // the session payload; details/edit can still use the richer lazy loader.
    const cardStages = useMemo<SessionStage[]>(() => {
        if (Array.isArray(session?.session_stages) && session.session_stages.length) {
            return normalizeStages(sortStagesInClient(session.session_stages));
        }

        if (Array.isArray(session?.stages) && session.stages.length) {
            return normalizeStages(sortStagesInClient(session.stages));
        }

        const scheduleStages = tryStagesFromSchedule(session?.schedule);
        if (scheduleStages.length) return scheduleStages;

        const embeddedTemplate = getEmbeddedTemplate(session);
        if (embeddedTemplate) {
            const embeddedBlocks =
                tryParseJson<any[]>(embeddedTemplate?.blocks) ||
                tryParseJson<any[]>(embeddedTemplate?.stages);

            if (Array.isArray(embeddedBlocks) && embeddedBlocks.length) {
                return normalizeStages(sortStagesInClient(embeddedBlocks));
            }

            const embeddedScheduleStages = tryStagesFromSchedule(embeddedTemplate?.schedule);
            if (embeddedScheduleStages.length) return embeddedScheduleStages;
        }

        const durationMinutes = Number(session?.duration_minutes);
        if (Number.isFinite(durationMinutes) && durationMinutes > 0) {
            return normalizeStages(
                sortStagesInClient([
                    {
                        id: `card-fallback-${String(session?.id || "session")}`,
                        kind: "focus",
                        title: "Focus",
                        durationMinutes,
                        position: 0,
                    },
                ])
            );
        }

        return [];
    }, [
        session?.id,
        session?.session_stages,
        session?.stages,
        session?.schedule,
        session?.session_template,
        session?.session_templates,
        session?.template,
        session?.templates,
        session?.duration_minutes,
    ]);
'''
          card = card.replace(marker, marker + card_stages, 1)

          old_outer = '<div className="flex flex-col xl:flex-row w-full gap-6">'
          new_outer = '<div className="flex flex-col min-[769px]:flex-row min-[769px]:items-center w-full gap-5 min-[1024px]:gap-6">'
          if old_outer not in card:
              raise SystemExit('outer session card layout not found')
          card = card.replace(old_outer, new_outer, 1)

          old_left = '<div className="flex min-w-0 flex-1 items-stretch justify-between gap-4">'
          new_left = '<div className="flex min-w-0 items-stretch justify-between gap-4 min-[769px]:w-[42%] min-[769px]:max-w-[620px] min-[769px]:shrink-0">'
          if old_left not in card:
              raise SystemExit('left session info layout not found')
          card = card.replace(old_left, new_left, 1)

          if '{peopleInline}' not in card:
              raise SystemExit('peopleInline render not found')
          card = card.replace('{peopleInline}', '{hasStarted ? peopleInline : null}', 1)

          old_controls = '<div className="grid w-full grid-cols-[auto_minmax(0,1fr)_48px] items-center gap-3 min-[769px]:flex min-[769px]:justify-end xl:w-auto">'
          new_controls = '<div className="grid w-full grid-cols-[auto_minmax(0,1fr)_48px] items-center gap-3 min-[769px]:flex min-[769px]:w-auto min-[769px]:shrink-0 min-[769px]:justify-end">'
          if old_controls not in card:
              raise SystemExit('right controls layout not found')

          timeline_block = '''                    <div className="w-full min-w-0 px-1 min-[769px]:flex-1 min-[769px]:px-0">
                        {cardStages.length > 0 ? (
                            <SessionStageBar
                                stages={cardStages}
                                startTime={timelineStartTime}
                                cycleSeconds={cycleSeconds}
                                progressStyle="tick"
                                tickEveryMs={tickEveryMs}
                                theme="light"
                            />
                        ) : (
                            <div
                                className="h-2 w-full rounded-full bg-[#E7E7E7]"
                                aria-label="Session timeline"
                            />
                        )}
                    </div>

                    '''
          card = card.replace(old_controls, timeline_block + new_controls, 1)

          old_occ_class = 'className="hidden xl:flex items-center gap-5 xl:mr-3 transition-opacity hover:opacity-70"'
          new_occ_class = 'className={`${hasStarted ? "hidden xl:flex" : "hidden"} items-center gap-5 xl:mr-3 transition-opacity hover:opacity-70`}'
          if old_occ_class not in card:
              raise SystemExit('occupancy button class not found')
          card = card.replace(old_occ_class, new_occ_class, 1)

          old_join_layout = 'w-full min-[769px]:flex-1 xl:w-auto xl:flex-none xl:min-w-[160px]'
          new_join_layout = 'w-full min-[769px]:w-auto min-[769px]:flex-none min-[769px]:min-w-[150px] xl:min-w-[160px]'
          if old_join_layout not in card:
              raise SystemExit('join button responsive layout not found')
          card = card.replace(old_join_layout, new_join_layout, 1)

          old_normalized = '''    const raw = Number.isFinite(elapsed) ? elapsed : 0;
              const normalized =
                loopSeconds > 0 ? ((raw % loopSeconds) + loopSeconds) % loopSeconds : raw;'''
          new_normalized = '''    const raw = Number.isFinite(elapsed) ? elapsed : 0;
              // Before a scheduled session starts, keep the marker at the beginning.
              // Modulo-wrapping a negative elapsed value made future sessions look active.
              const normalized =
                raw <= 0
                  ? 0
                  : loopSeconds > 0
                    ? raw % loopSeconds
                    : raw;'''
          if old_normalized not in bar:
              raise SystemExit('SessionStageBar normalized-time block not found')
          bar = bar.replace(old_normalized, new_normalized, 1)

          card_path.write_text(card)
          bar_path.write_text(bar)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SessionCard.tsx src/components/SessionStageBar.tsx
          git commit -m "Show session timeline before live occupancy"
          git push origin main
