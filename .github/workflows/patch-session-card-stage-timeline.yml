name: Patch session card stage timeline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-session-card-stage-timeline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply session-card patch
        run: python scripts/patch-session-card-stage-timeline.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vite production build
        run: npx vite build

      - name: Check diff
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SessionCard.tsx src/components/SessionStageBar.tsx
          git commit -m "Show session timeline before live occupancy"
          git push origin main
