name: Patch session card responsive layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-session-card-responsive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch responsive session card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SessionCard.tsx')
          text = path.read_text()

          replacements = [
              (
                  'border rounded-[42px] bg-white',
                  'border rounded-[30px] sm:rounded-[36px] min-[1024px]:rounded-[42px] bg-white',
              ),
              (
                  'flex flex-col min-[769px]:flex-row min-[769px]:items-center w-full gap-4 min-[769px]:gap-2 min-[1024px]:gap-3',
                  'flex flex-col min-[1024px]:flex-row min-[1024px]:items-center w-full gap-3 min-[1024px]:gap-3 xl:gap-4',
              ),
              (
                  'flex min-w-0 items-stretch justify-between gap-4 min-[769px]:w-auto min-[769px]:max-w-[620px] min-[769px]:shrink-0',
                  'flex w-full min-w-0 items-stretch justify-between gap-3 min-[1024px]:w-auto min-[1024px]:max-w-[600px] min-[1024px]:shrink-0',
              ),
              (
                  'text-[24px] md:text-[29px] font-bold leading-tight',
                  'text-[16px] min-[420px]:text-[18px] sm:text-[20px] min-[1024px]:text-[24px] xl:text-[29px] font-bold leading-tight',
              ),
              (
                  'flex flex-wrap items-center gap-4 text-[12px] text-[#606060]',
                  'flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] sm:text-[12px] text-[#606060]',
              ),
              (
                  'hidden min-[481px]:inline-flex items-center gap-1 px-3 py-1 rounded-full border',
                  'inline-flex items-center gap-1 px-2 min-[481px]:px-3 py-1 rounded-full border',
              ),
              (
                  'w-full min-w-0 px-1 min-[769px]:flex-1 min-[769px]:px-0',
                  'w-full min-w-0 px-0 min-[1024px]:flex-1',
              ),
              (
                  '                                theme="light"\n                                showLegend',
                  '                                theme="light"',
              ),
              (
                  'grid w-full grid-cols-[auto_minmax(0,1fr)_48px] items-center gap-3 min-[769px]:flex min-[769px]:w-auto min-[769px]:shrink-0 min-[769px]:justify-end',
                  'grid w-full grid-cols-[auto_minmax(0,1fr)_48px] items-center gap-3 min-[1024px]:flex min-[1024px]:w-auto min-[1024px]:shrink-0 min-[1024px]:justify-end',
              ),
              (
                  'w-full min-[769px]:w-auto min-[769px]:flex-none min-[769px]:min-w-[150px] xl:min-w-[160px]',
                  'w-full min-[1024px]:w-auto min-[1024px]:flex-none min-[1024px]:min-w-[150px] xl:min-w-[160px]',
              ),
              (
                  'h-12 min-w-0 sm:min-w-[160px] rounded-full px-4 sm:px-6 text-[14px] font-semibold',
                  'h-12 min-w-0 min-[1024px]:min-w-[160px] rounded-full px-4 min-[1024px]:px-6 text-[14px] font-semibold',
              ),
              (
                  '<span className="hidden sm:inline">Book session</span>',
                  '<span className="hidden min-[1024px]:inline">Book session</span>',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected fragment not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Production build
        run: npx vite build

      - name: Check diff
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SessionCard.tsx
          git commit -m 'Make session cards responsive across screen sizes' || exit 0
          git push origin main
