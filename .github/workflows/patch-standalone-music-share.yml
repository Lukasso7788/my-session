name: Patch standalone music sharing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-standalone-music-share.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate standalone music sharing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Add the standalone player fast path to App. It deliberately sits
          # outside AppBootstrapGate so opening a music share tab does not start
          # auth/database/bootstrap traffic.
          app_path = Path('src/App.tsx')
          app = app_path.read_text()

          import_anchor = 'import IconVectorizerPage from "./pages/IconVectorizerPage";\n'
          import_line = 'import StandaloneSoundscapePage from "./pages/StandaloneSoundscapePage";\n'
          if import_line not in app:
              if import_anchor not in app:
                  raise SystemExit('App import anchor not found')
              app = app.replace(import_anchor, import_anchor + import_line, 1)

          app_var_anchor = '''  const isOneOnOneHost =\n    typeof window !== "undefined" &&\n    window.location.hostname.toLowerCase() === "1-on-1.mysession.club";\n'''
          app_var_new = app_var_anchor + '''  const isStandaloneSoundscape =\n    typeof window !== "undefined" &&\n    window.location.pathname === "/music-player";\n'''
          if 'const isStandaloneSoundscape =' not in app:
              if app_var_anchor not in app:
                  raise SystemExit('App standalone variable anchor not found')
              app = app.replace(app_var_anchor, app_var_new, 1)

          effect_anchor = '''  useEffect(() => {\n    storeReferralCodeFromUrl();\n  }, []);\n\n\n  return (\n'''
          effect_new = '''  useEffect(() => {\n    storeReferralCodeFromUrl();\n  }, []);\n\n  if (isStandaloneSoundscape) {\n    return <StandaloneSoundscapePage />;\n  }\n\n  return (\n'''
          if 'return <StandaloneSoundscapePage />;' not in app:
              if effect_anchor not in app:
                  raise SystemExit('App return anchor not found')
              app = app.replace(effect_anchor, effect_new, 1)

          app_path.write_text(app)

          # 2) Add an explicit "Open share tab" action to the existing music panel.
          panel_path = Path('src/pages/livekit/RoomSoundscapePanel.tsx')
          panel = panel_path.read_text()

          if '  ExternalLink,\n' not in panel:
              panel = panel.replace('  Pause,\n', '  ExternalLink,\n  Pause,\n', 1)

          relative_anchor = '''  const selectRelative = (offset: number) => {\n    if (!canControl || busy) return;\n    const count = ROOM_SOUNDSCAPE_OPTIONS.length;\n    const start = selectedIndex >= 0 ? selectedIndex : offset > 0 ? -1 : 0;\n    const nextIndex = (start + offset + count) % count;\n    onSelect(ROOM_SOUNDSCAPE_OPTIONS[nextIndex].id);\n  };\n'''
          relative_new = relative_anchor + '''\n  const openStandalonePlayer = () => {\n    if (activeId === "custom") return;\n    const trackId = activeId || ROOM_SOUNDSCAPE_OPTIONS[0].id;\n    const params = new URLSearchParams({\n      track: trackId,\n      position: String(Math.max(0, shownPosition)),\n      volume: String(Math.max(0, Math.min(100, volume))),\n      autoplay: playing ? "1" : "0",\n    });\n    window.open(\n      `/music-player?${params.toString()}`,\n      "mysession-music-share",\n      "noopener,noreferrer",\n    );\n  };\n'''
          if 'const openStandalonePlayer =' not in panel:
              if relative_anchor not in panel:
                  raise SystemExit('RoomSoundscapePanel function anchor not found')
              panel = panel.replace(relative_anchor, relative_new, 1)

          mute_anchor = '''            {personalMuted ? "Unmute for me" : "Mute for me"}\n          </button>\n        </section>\n'''
          mute_new = '''            {personalMuted ? "Unmute for me" : "Mute for me"}\n          </button>\n\n          <button\n            type="button"\n            disabled={activeId === "custom"}\n            onClick={openStandalonePlayer}\n            className="mt-2 flex h-10 w-full items-center justify-center gap-2 rounded-xl border border-[#D8D5D5] bg-white text-[10px] font-semibold text-[#2F2F2F] transition hover:bg-[#F3F1F1] disabled:cursor-not-allowed disabled:opacity-35"\n            title={activeId === "custom" ? "Uploaded tracks cannot be opened in the standalone tab yet" : "Open a standalone music tab for browser tab-audio sharing"}\n          >\n            <ExternalLink className="h-3.5 w-3.5" strokeWidth={1.8} />\n            Open standalone share tab\n          </button>\n          <p className="mt-1.5 px-1 text-[8px] leading-4 text-[#2F2F2F]/40">\n            Share that tab from the room and enable browser tab audio.\n          </p>\n        </section>\n'''
          if 'Open standalone share tab' not in panel:
              if mute_anchor not in panel:
                  raise SystemExit('RoomSoundscapePanel mute anchor not found')
              panel = panel.replace(mute_anchor, mute_new, 1)

          panel_path.write_text(panel)

          # 3) Existing screen sharing explicitly disabled capture audio. Turn it
          # on for the LiveKit screen-share paths so Chrome/Edge can publish the
          # selected standalone tab audio. The manual tablet capture path remains
          # video-only for compatibility.
          room_path = Path('src/pages/RoomPageLiveKit.tsx')
          room = room_path.read_text()
          pattern = re.compile(r'(setScreenShareEnabled\(true,\s*\{\s*audio:\s*)false(,\s*video:\s*true)', re.MULTILINE)
          room, replacements = pattern.subn(r'\1true\2', room)
          if replacements < 1:
              raise SystemExit('No LiveKit screen-share audio flags were updated')
          room_path.write_text(room)

          print(f'Enabled screen-share audio in {replacements} LiveKit path(s).')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: App typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production Vite build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/pages/livekit/RoomSoundscapePanel.tsx src/pages/RoomPageLiveKit.tsx
          git commit -m 'Add standalone music tab sharing' || exit 0
          git push origin main
