name: Patch session card stage labels

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-session-card-stage-labels.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply session-card stage labels polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch card spacing and stage labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          card_path = Path('src/components/SessionCard.tsx')
          bar_path = Path('src/components/SessionStageBar.tsx')
          card = card_path.read_text()
          bar = bar_path.read_text()

          old_props = '''  tickEveryMs?: number;\n  theme?: RoomTheme;\n}'''
          new_props = '''  tickEveryMs?: number;\n  theme?: RoomTheme;\n  showLegend?: boolean;\n}'''
          if old_props not in bar:
              raise SystemExit('Props marker not found')
          bar = bar.replace(old_props, new_props, 1)

          old_destructure = '''  progressStyle = "fill",\n  tickEveryMs = 1000,\n  theme = "dark",\n}: Props) {'''
          new_destructure = '''  progressStyle = "fill",\n  tickEveryMs = 1000,\n  theme = "dark",\n  showLegend = false,\n}: Props) {'''
          if old_destructure not in bar:
              raise SystemExit('destructure marker not found')
          bar = bar.replace(old_destructure, new_destructure, 1)

          marker = '  const markerLeftPercent = clamp(cycleProgress * 100, 0.5, 99.5);\n'
          legend_code = '''\n  const legendItems = useMemo(() => {\n    const shortLabelByKind: Record<StageKind, string> = {\n      welcome: "Welcome",\n      intentions: "Plan",\n      focus: "Focus",\n      break: "Break",\n      checkin: "Check-in",\n      recap: "Recap",\n      celebrate: "Celebrate",\n      farewell: "End",\n      custom: "Custom",\n    };\n\n    const seen = new Set<string>();\n    const items: Array<{ key: string; label: string; color: string }> = [];\n\n    for (const stage of stages || []) {\n      const visual = resolveStageVisual(stage as any);\n      const key = visual.kind === "custom"\n        ? `${visual.kind}:${visual.name.toLowerCase()}`\n        : visual.kind;\n      if (seen.has(key)) continue;\n      seen.add(key);\n\n      items.push({\n        key,\n        label: visual.kind === "custom"\n          ? String(visual.name || "Custom").slice(0, 14)\n          : shortLabelByKind[visual.kind],\n        color: visual.color,\n      });\n    }\n\n    return items;\n  }, [stages]);\n'''
          if marker not in bar:
              raise SystemExit('markerLeftPercent marker not found')
          bar = bar.replace(marker, marker + legend_code, 1)

          old_return = '''  return (\n    <div className="relative w-full h-[10px] overflow-visible">'''
          new_return = '''  return (\n    <div className="w-full min-w-0">\n      <div className="relative w-full h-[10px] overflow-visible">'''
          if old_return not in bar:
              raise SystemExit('return wrapper marker not found')
          bar = bar.replace(old_return, new_return, 1)

          old_tail = '''      {progressStyle === "tick" && (\n        <div\n          className="absolute pointer-events-none z-[40]"\n          style={{\n            left: `${markerLeftPercent}%`,\n            top: -2.5,\n            width: 2,\n            height: 15,\n            transform: "translateX(-50%)",\n            backgroundColor: markerColor,\n            borderRadius: 9999,\n            boxShadow:\n              theme === "light"\n                ? "0 0 0 1px rgba(255,255,255,0.65)"\n                : "0 0 0 1px rgba(15,23,42,0.45)",\n          }}\n        />\n      )}\n    </div>\n  );'''
          new_tail = '''      {progressStyle === "tick" && (\n        <div\n          className="absolute pointer-events-none z-[40]"\n          style={{\n            left: `${markerLeftPercent}%`,\n            top: -2.5,\n            width: 2,\n            height: 15,\n            transform: "translateX(-50%)",\n            backgroundColor: markerColor,\n            borderRadius: 9999,\n            boxShadow:\n              theme === "light"\n                ? "0 0 0 1px rgba(255,255,255,0.65)"\n                : "0 0 0 1px rgba(15,23,42,0.45)",\n          }}\n        />\n      )}\n      </div>\n\n      {showLegend && legendItems.length > 0 && (\n        <div className="mt-2 flex min-w-0 flex-wrap items-center gap-x-3 gap-y-1 text-[9px] font-medium leading-none text-[#777777] sm:text-[10px]">\n          {legendItems.map((item) => (\n            <span key={item.key} className="inline-flex items-center gap-1 whitespace-nowrap">\n              <span\n                className="h-1.5 w-1.5 shrink-0 rounded-full"\n                style={stageColorStyle(item.color)}\n                aria-hidden="true"\n              />\n              {item.label}\n            </span>\n          ))}\n        </div>\n      )}\n    </div>\n  );'''
          if old_tail not in bar:
              raise SystemExit('stage bar tail marker not found')
          bar = bar.replace(old_tail, new_tail, 1)

          old_outer = '<div className="flex flex-col min-[769px]:flex-row min-[769px]:items-center w-full gap-4 min-[769px]:gap-5 min-[1024px]:gap-6">'
          new_outer = '<div className="flex flex-col min-[769px]:flex-row min-[769px]:items-center w-full gap-4 min-[769px]:gap-2 min-[1024px]:gap-3">'
          if old_outer not in card:
              raise SystemExit('session card outer layout marker not found')
          card = card.replace(old_outer, new_outer, 1)

          old_left = '<div className="flex min-w-0 items-stretch justify-between gap-4 min-[769px]:w-[42%] min-[769px]:max-w-[620px] min-[769px]:shrink-0">'
          new_left = '<div className="flex min-w-0 items-stretch justify-between gap-4 min-[769px]:w-auto min-[769px]:max-w-[620px] min-[769px]:shrink-0">'
          if old_left not in card:
              raise SystemExit('session card left layout marker not found')
          card = card.replace(old_left, new_left, 1)

          old_bar_call = '''                                tickEveryMs={tickEveryMs}\n                                theme="light"\n                            />'''
          new_bar_call = '''                                tickEveryMs={tickEveryMs}\n                                theme="light"\n                                showLegend\n                            />'''
          if old_bar_call not in card:
              raise SystemExit('SessionStageBar call marker not found')
          card = card.replace(old_bar_call, new_bar_call, 1)

          card_path.write_text(card)
          bar_path.write_text(bar)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production build
        run: npx vite build
      - name: Check diff
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SessionCard.tsx src/components/SessionStageBar.tsx
          git commit -m "Tighten session timeline spacing and add stage labels"
          git push origin main
