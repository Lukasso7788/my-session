name: Patch per-stage session timeline labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-session-stage-labels-per-segment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch every timeline segment label
        run: python scripts/patch-session-stage-labels-per-segment.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SessionStageBar.tsx
          git commit -m 'Label every session timeline stage' || exit 0
          git push origin main
