name: Apply Infinity pins and screen-share policy

on:
  push:
    paths:
      - .github/workflows/apply-infinity-pins-screen-share.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic patch
        run: python scripts/apply-infinity-pins-screen-share.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/roomPolicies.ts src/pages/livekit/RoomSettingsModalLiveKit.tsx src/pages/RoomPageLiveKit.tsx src/pages/SessionsPage.tsx src/components/SessionCard.tsx src/components/CreateSessionModal.tsx supabase/migrations/20260917000000_infinite_room_pins_and_screen_share_policy.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add pinned Infinity rooms and screen-share policy"
          git push origin HEAD:main
