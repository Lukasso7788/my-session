name: Patch shared tab music controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-shared-tab-music-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate shared tab music with music controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          room_path = Path('src/pages/RoomPageLiveKit.tsx')
          room = room_path.read_text()

          packet_anchor = '''type RoomSoundtrackPacket =\n  | { type: "soundtrack_state"; state: RoomSoundtrackState }\n  | { type: "soundtrack_request"; requestedAt: number };\n'''
          packet_new = '''type RoomSoundtrackPacket =\n  | { type: "soundtrack_state"; state: RoomSoundtrackState }\n  | { type: "tab_music_volume"; volume: number; updatedAt: number }\n  | { type: "soundtrack_request"; requestedAt: number };\n'''
          if 'type: "tab_music_volume"' not in room:
              if packet_anchor not in room:
                  raise SystemExit('RoomSoundtrackPacket anchor not found')
              room = room.replace(packet_anchor, packet_new, 1)

          state_anchor = '''  const [sharingTabMusic, setSharingTabMusic] = useState(false);\n  const [tabMusicShareBusy, setTabMusicShareBusy] = useState(false);\n  const [tabMusicShareError, setTabMusicShareError] = useState<string | null>(null);\n'''
          state_new = state_anchor + '''  const [remoteSharedTabMusicActive, setRemoteSharedTabMusicActive] = useState(false);\n'''
          if 'remoteSharedTabMusicActive' not in room:
              if state_anchor not in room:
                  raise SystemExit('shared tab state anchor not found')
              room = room.replace(state_anchor, state_new, 1)

          start_anchor = '''      sharedTabMusicPublicationRef.current = publication;\n      setSharingTabMusic(true);\n\n      const handleCaptureEnded = () => {\n'''
          start_new = '''      sharedTabMusicPublicationRef.current = publication;\n      setSharingTabMusic(true);\n      void publishSoundtrackPacket({\n        type: "tab_music_volume",\n        volume: roomSoundscapeVolume,\n        updatedAt: Date.now(),\n      }).catch(() => { });\n\n      const handleCaptureEnded = () => {\n'''
          if 'type: "tab_music_volume",\n        volume: roomSoundscapeVolume' not in room:
              if start_anchor not in room:
                  raise SystemExit('tab music publish anchor not found')
              room = room.replace(start_anchor, start_new, 1)

          effect_anchor = '''  useEffect(\n    () => () => {\n      sharedTabMusicStreamRef.current?.getTracks().forEach((track) => track.stop());\n      sharedTabMusicStreamRef.current = null;\n      sharedTabMusicPublicationRef.current = null;\n    },\n    [],\n  );\n\n  const publishSoundtrackPacket = async (packet: RoomSoundtrackPacket) => {\n'''
          effect_new = '''  useEffect(\n    () => () => {\n      sharedTabMusicStreamRef.current?.getTracks().forEach((track) => track.stop());\n      sharedTabMusicStreamRef.current = null;\n      sharedTabMusicPublicationRef.current = null;\n    },\n    [],\n  );\n\n  const sharedTabMusicActive = sharingTabMusic || remoteSharedTabMusicActive;\n\n  useEffect(() => {\n    const room = roomRef.current;\n    if (!connected || !room) {\n      setRemoteSharedTabMusicActive(false);\n      return;\n    }\n\n    const refreshSharedTabMusicPlayback = () => {\n      let active = false;\n      const localVolume =\n        selfDeafened || soundscapeMuted || soundscapeListeningMode === "personal"\n          ? 0\n          : clamp(roomSoundscapeVolume, 0, 100) / 100;\n\n      room.remoteParticipants.forEach((participant) => {\n        participant.audioTrackPublications.forEach((publication: any) => {\n          const trackName = String(\n            publication?.trackName || publication?.track?.name || publication?.name || "",\n          ).trim();\n          if (trackName !== "shared_tab_music") return;\n\n          if (publication?.isMuted !== true) active = true;\n          if (publication?.track instanceof RemoteAudioTrack) {\n            try {\n              publication.track.setVolume(localVolume);\n            } catch { }\n          }\n        });\n      });\n\n      setRemoteSharedTabMusicActive(active);\n    };\n\n    refreshSharedTabMusicPlayback();\n    room.on(RoomEvent.TrackPublished as any, refreshSharedTabMusicPlayback as any);\n    room.on(RoomEvent.TrackUnpublished as any, refreshSharedTabMusicPlayback as any);\n    room.on(RoomEvent.TrackSubscribed, refreshSharedTabMusicPlayback as any);\n    room.on(RoomEvent.TrackUnsubscribed, refreshSharedTabMusicPlayback as any);\n    room.on(RoomEvent.TrackMuted as any, refreshSharedTabMusicPlayback as any);\n    room.on(RoomEvent.TrackUnmuted as any, refreshSharedTabMusicPlayback as any);\n    room.on(RoomEvent.ParticipantConnected, refreshSharedTabMusicPlayback as any);\n    room.on(RoomEvent.ParticipantDisconnected, refreshSharedTabMusicPlayback as any);\n\n    return () => {\n      room.off(RoomEvent.TrackPublished as any, refreshSharedTabMusicPlayback as any);\n      room.off(RoomEvent.TrackUnpublished as any, refreshSharedTabMusicPlayback as any);\n      room.off(RoomEvent.TrackSubscribed, refreshSharedTabMusicPlayback as any);\n      room.off(RoomEvent.TrackUnsubscribed, refreshSharedTabMusicPlayback as any);\n      room.off(RoomEvent.TrackMuted as any, refreshSharedTabMusicPlayback as any);\n      room.off(RoomEvent.TrackUnmuted as any, refreshSharedTabMusicPlayback as any);\n      room.off(RoomEvent.ParticipantConnected, refreshSharedTabMusicPlayback as any);\n      room.off(RoomEvent.ParticipantDisconnected, refreshSharedTabMusicPlayback as any);\n    };\n  }, [\n    connected,\n    roomState,\n    roomSoundscapeVolume,\n    selfDeafened,\n    soundscapeListeningMode,\n    soundscapeMuted,\n  ]);\n\n  const publishSoundtrackPacket = async (packet: RoomSoundtrackPacket) => {\n'''
          if 'const sharedTabMusicActive = sharingTabMusic || remoteSharedTabMusicActive;' not in room:
              if effect_anchor not in room:
                  raise SystemExit('shared tab playback effect anchor not found')
              room = room.replace(effect_anchor, effect_new, 1)

          volume_anchor = '''  const adjustRoomSoundtrackVolume = (rawVolume: number) => {\n    if (!canControlRoomSoundtrack) return;\n    const volume = Math.max(0, Math.min(100, Math.round(rawVolume)));\n    setRoomSoundscapeVolume(volume);\n    soundscapeEngineRef.current?.setVolume(volume / 100);\n\n    const current = soundscapeStateRef.current;\n    if (!current) return;\n    const position = current.playing\n      ? soundscapeEngineRef.current?.currentTime() ?? current.position\n      : current.position;\n    const next: RoomSoundtrackState = {\n      ...current,\n      volume,\n      position,\n      updatedAt: Date.now(),\n    };\n    soundscapeStateRef.current = next;\n    if (soundscapeVolumePublishTimerRef.current != null) {\n      window.clearTimeout(soundscapeVolumePublishTimerRef.current);\n    }\n    soundscapeVolumePublishTimerRef.current = window.setTimeout(() => {\n      soundscapeVolumePublishTimerRef.current = null;\n      const latest = soundscapeStateRef.current;\n      if (latest) {\n        void publishSoundtrackPacket({\n          type: "soundtrack_state",\n          state: latest,\n        }).catch(() => { });\n      }\n    }, 100);\n  };\n'''
          volume_new = '''  const adjustRoomSoundtrackVolume = (rawVolume: number) => {\n    if (!canControlRoomSoundtrack) return;\n    const volume = Math.max(0, Math.min(100, Math.round(rawVolume)));\n    setRoomSoundscapeVolume(volume);\n    soundscapeEngineRef.current?.setVolume(volume / 100);\n\n    const current = soundscapeStateRef.current;\n    if (current) {\n      const position = current.playing\n        ? soundscapeEngineRef.current?.currentTime() ?? current.position\n        : current.position;\n      const next: RoomSoundtrackState = {\n        ...current,\n        volume,\n        position,\n        updatedAt: Date.now(),\n      };\n      soundscapeStateRef.current = next;\n    }\n\n    if (!current && !sharedTabMusicActive) return;\n    if (soundscapeVolumePublishTimerRef.current != null) {\n      window.clearTimeout(soundscapeVolumePublishTimerRef.current);\n    }\n    soundscapeVolumePublishTimerRef.current = window.setTimeout(() => {\n      soundscapeVolumePublishTimerRef.current = null;\n      const latest = soundscapeStateRef.current;\n      if (latest) {\n        void publishSoundtrackPacket({\n          type: "soundtrack_state",\n          state: latest,\n        }).catch(() => { });\n      }\n      if (sharedTabMusicActive) {\n        void publishSoundtrackPacket({\n          type: "tab_music_volume",\n          volume,\n          updatedAt: Date.now(),\n        }).catch(() => { });\n      }\n    }, 100);\n  };\n'''
          if 'if (!current && !sharedTabMusicActive) return;' not in room:
              if volume_anchor not in room:
                  raise SystemExit('adjustRoomSoundtrackVolume anchor not found')
              room = room.replace(volume_anchor, volume_new, 1)

          data_anchor = '''        if (packet.type === "soundtrack_state" && packet.state) {\n          if (!sender) return;\n'''
          data_new = '''        if (packet.type === "tab_music_volume") {\n          if (!sender) return;\n          const senderUserId = extractBaseUserIdFromIdentity(\n            String(sender.identity || ""),\n          )\n            .trim()\n            .toLowerCase();\n          const senderCanControl =\n            (sender as any)?.permissions?.roomAdmin === true ||\n            participantControlSenderIdsRef.current.has(senderUserId);\n          if (!senderCanControl) return;\n          const nextVolume = Math.max(\n            0,\n            Math.min(100, Number.isFinite(Number(packet.volume)) ? Number(packet.volume) : 35),\n          );\n          setRoomSoundscapeVolume(nextVolume);\n          return;\n        }\n        if (packet.type === "soundtrack_state" && packet.state) {\n          if (!sender) return;\n'''
          if 'if (packet.type === "tab_music_volume")' not in room:
              if data_anchor not in room:
                  raise SystemExit('soundtrack data anchor not found')
              room = room.replace(data_anchor, data_new, 1)

          request_anchor = '''        if (packet.type === "soundtrack_request" && canControlRoomSoundtrack) {\n          const current = soundscapeStateRef.current;\n          if (current) {\n            void publishSoundtrackPacket({\n              type: "soundtrack_state",\n              state: current,\n            }).catch(() => { });\n          }\n        }\n'''
          request_new = '''        if (packet.type === "soundtrack_request" && canControlRoomSoundtrack) {\n          const current = soundscapeStateRef.current;\n          if (current) {\n            void publishSoundtrackPacket({\n              type: "soundtrack_state",\n              state: current,\n            }).catch(() => { });\n          }\n          if (sharedTabMusicActive) {\n            void publishSoundtrackPacket({\n              type: "tab_music_volume",\n              volume: roomSoundscapeVolume,\n              updatedAt: Date.now(),\n            }).catch(() => { });\n          }\n        }\n'''
          if 'if (sharedTabMusicActive) {\n            void publishSoundtrackPacket({\n              type: "tab_music_volume"' not in room:
              if request_anchor not in room:
                  raise SystemExit('soundtrack request anchor not found')
              room = room.replace(request_anchor, request_new, 1)

          deps_anchor = '''  }, [connected, roomState, canControlRoomSoundtrack, canUploadRoomSoundtrack]);\n'''
          deps_new = '''  }, [\n    connected,\n    roomState,\n    canControlRoomSoundtrack,\n    canUploadRoomSoundtrack,\n    sharedTabMusicActive,\n    roomSoundscapeVolume,\n  ]);\n'''
          if deps_anchor in room:
              room = room.replace(deps_anchor, deps_new, 1)

          participant_volume_anchor = '''      participant.setVolume(vol, Track.Source.Microphone);\n      participant.setVolume(vol, Track.Source.ScreenShareAudio);\n    } catch { }\n'''
          participant_volume_new = '''      participant.setVolume(vol, Track.Source.Microphone);\n      participant.setVolume(vol, Track.Source.ScreenShareAudio);\n\n      // Shared tab music has its own room-music volume/mute state and must not\n      // inherit the host participant's voice-volume slider.\n      participant.audioTrackPublications.forEach((publication: any) => {\n        const trackName = String(\n          publication?.trackName || publication?.track?.name || publication?.name || "",\n        ).trim();\n        if (trackName !== "shared_tab_music") return;\n        if (publication?.track instanceof RemoteAudioTrack) {\n          publication.track.setVolume(\n            selfDeafenedRef.current || soundscapeMuted || soundscapeListeningMode === "personal"\n              ? 0\n              : clamp(roomSoundscapeVolume, 0, 100) / 100,\n          );\n        }\n      });\n    } catch { }\n'''
          if 'Shared tab music has its own room-music volume/mute state' not in room:
              if participant_volume_anchor not in room:
                  raise SystemExit('participant volume anchor not found')
              room = room.replace(participant_volume_anchor, participant_volume_new, 1)

          panel_props_anchor = '''          canShareTabMusic={canShareTabMusic}\n          sharingTabMusic={sharingTabMusic}\n          tabMusicShareBusy={tabMusicShareBusy}\n'''
          panel_props_new = '''          canShareTabMusic={canShareTabMusic}\n          sharingTabMusic={sharingTabMusic}\n          tabMusicActive={sharedTabMusicActive}\n          tabMusicShareBusy={tabMusicShareBusy}\n'''
          if 'tabMusicActive={sharedTabMusicActive}' not in room:
              if panel_props_anchor not in room:
                  raise SystemExit('panel tab music props anchor not found')
              room = room.replace(panel_props_anchor, panel_props_new, 1)

          bottom_active_anchor = '''          soundscapeActive={\n            soundscapeListeningMode === "room"\n              ? activeSoundscapeId !== null && soundscapePlaying\n              : personalSoundscapeId !== null && personalSoundscapePlaying\n          }\n'''
          bottom_active_new = '''          soundscapeActive={\n            soundscapeListeningMode === "room"\n              ? (activeSoundscapeId !== null && soundscapePlaying) || sharedTabMusicActive\n              : personalSoundscapeId !== null && personalSoundscapePlaying\n          }\n'''
          if '|| sharedTabMusicActive' not in room:
              if bottom_active_anchor not in room:
                  raise SystemExit('bottom soundscape active anchor not found')
              room = room.replace(bottom_active_anchor, bottom_active_new, 1)

          room_path.write_text(room)

          panel_path = Path('src/pages/livekit/RoomSoundscapePanel.tsx')
          panel = panel_path.read_text()

          signature_anchor = '''  canShareTabMusic,\n  sharingTabMusic,\n  tabMusicShareBusy,\n'''
          signature_new = '''  canShareTabMusic,\n  sharingTabMusic,\n  tabMusicActive,\n  tabMusicShareBusy,\n'''
          if '  tabMusicActive,\n' not in panel:
              if signature_anchor not in panel:
                  raise SystemExit('panel signature tab music anchor not found')
              panel = panel.replace(signature_anchor, signature_new, 1)

          type_anchor = '''  canShareTabMusic: boolean;\n  sharingTabMusic: boolean;\n  tabMusicShareBusy: boolean;\n'''
          type_new = '''  canShareTabMusic: boolean;\n  sharingTabMusic: boolean;\n  tabMusicActive: boolean;\n  tabMusicShareBusy: boolean;\n'''
          if '  tabMusicActive: boolean;\n' not in panel:
              if type_anchor not in panel:
                  raise SystemExit('panel type tab music anchor not found')
              panel = panel.replace(type_anchor, type_new, 1)

          label_anchor = '''  const activeLabel =\n    activeId === "custom"\n      ? customTrackLabel || "Custom track"\n      : activeOption?.label || "Choose a track";\n'''
          label_new = '''  const activeLabel =\n    activeId === "custom"\n      ? customTrackLabel || "Custom track"\n      : activeOption?.label ||\n        (listeningMode === "room" && tabMusicActive ? "Shared tab music" : "Choose a track");\n'''
          if 'tabMusicActive ? "Shared tab music"' not in panel:
              if label_anchor not in panel:
                  raise SystemExit('panel active label anchor not found')
              panel = panel.replace(label_anchor, label_new, 1)

          mute_anchor = '''            disabled={!activeId}\n            onClick={onToggleMute}\n'''
          mute_new = '''            disabled={!activeId && !tabMusicActive}\n            onClick={onToggleMute}\n'''
          if 'disabled={!activeId && !tabMusicActive}' not in panel:
              if mute_anchor not in panel:
                  raise SystemExit('panel mute anchor not found')
              panel = panel.replace(mute_anchor, mute_new, 1)

          panel_path.write_text(panel)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production Vite build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/RoomPageLiveKit.tsx src/pages/livekit/RoomSoundscapePanel.tsx
          git commit -m 'Unify shared tab music with room music controls' || exit 0
          git push origin main
