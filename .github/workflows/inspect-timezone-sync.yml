name: Inspect timezone sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-timezone-sync.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect room auth and timezone publication paths
        shell: bash
        run: |
          echo '=== useAuth / profile in RoomPage ==='
          grep -nE 'useAuth\(|const \{[^}]*profile|profile\?\.timezone|profile\.timezone' src/pages/RoomPageLiveKit.tsx || true
          echo '=== component declaration vicinity ==='
          grep -nE '^export default function|^function RoomPage|const RoomPage' src/pages/RoomPageLiveKit.tsx || true
          echo '=== local timezone publication ==='
          sed -n '13660,13720p' src/pages/RoomPageLiveKit.tsx
          echo '=== tile build local+remote ==='
          sed -n '12990,13140p' src/pages/RoomPageLiveKit.tsx
          echo '=== profile save ==='
          sed -n '570,635p' src/pages/ProfilePage.tsx
          echo '=== AuthContext profile lifecycle ==='
          sed -n '1,220p' src/context/AuthContext.tsx
