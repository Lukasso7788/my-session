name: Inspect timezone sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-timezone-sync.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect room profile map and local auth IDs
        shell: bash
        run: |
          echo '=== profilesById refs ==='
          grep -n -B 6 -A 16 'profilesById' src/pages/RoomPageLiveKit.tsx || true
          echo '=== profile fetches in room ==='
          grep -n -B 5 -A 14 '\.from("profiles")' src/pages/RoomPageLiveKit.tsx || true
          echo '=== authUserId definition refs ==='
          grep -n -B 8 -A 12 'authUserId' src/pages/RoomPageLiveKit.tsx | head -n 180 || true
          echo '=== profile event constants/usages ==='
          grep -RIn 'AUTH_PROFILE_READY_EVENT\|profile-ready\|profile.*updated' src | head -n 160 || true
