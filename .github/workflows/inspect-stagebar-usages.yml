name: Fix stage bar sizing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-stagebar-usages.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore default stage bar height and keep cards enlarged
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stagebar = Path('src/components/SessionStageBar.tsx')
          text = stagebar.read_text()

          replacements = [
              (
                  '  showLegend?: boolean;\n}',
                  '  showLegend?: boolean;\n  size?: "default" | "card";\n}',
                  1,
              ),
              (
                  '  showLegend = false,\n}: Props) {',
                  '  showLegend = false,\n  size = "default",\n}: Props) {',
                  1,
              ),
              (
                  '  const markerLeftPercent = clamp(cycleProgress * 100, 0.5, 99.5);\n',
                  '  const markerLeftPercent = clamp(cycleProgress * 100, 0.5, 99.5);\n  const isCardSize = size === "card";\n  const trackHeightClass = isCardSize ? "h-[10px]" : "h-2";\n  const markerTop = isCardSize ? -2.5 : -3;\n  const markerHeight = isCardSize ? 15 : 12;\n',
                  1,
              ),
              (
                  '      <div className="relative w-full h-[10px] overflow-visible">',
                  '      <div className={`relative w-full ${trackHeightClass} overflow-visible`}>',
                  1,
              ),
              (
                  '        className={`absolute inset-x-0 top-0 h-[10px] flex rounded-full overflow-visible ${trackBgClass}`}',
                  '        className={`absolute inset-x-0 top-0 ${trackHeightClass} flex rounded-full overflow-visible ${trackBgClass}`}',
                  1,
              ),
              ('            top: -2.5,', '            top: markerTop,', 1),
              ('            height: 15,', '            height: markerHeight,', 1),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'SessionStageBar replacement mismatch: expected {expected}, found {count}: {old!r}')
              text = text.replace(old, new, expected)

          stagebar.write_text(text)

          card = Path('src/components/SessionCard.tsx')
          text = card.read_text()
          old = '''                                tickEveryMs={tickEveryMs}\n                                theme="light"\n                            />'''
          new = '''                                tickEveryMs={tickEveryMs}\n                                theme="light"\n                                size="card"\n                            />'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one main card stage bar call, found {count}')
          card.write_text(text.replace(old, new, 1))
          PY

      - name: Verify scoped sizing
        shell: bash
        run: |
          grep -q 'size?: "default" | "card"' src/components/SessionStageBar.tsx
          grep -q 'const trackHeightClass = isCardSize ? "h-\[10px\]" : "h-2"' src/components/SessionStageBar.tsx
          grep -q 'const markerHeight = isCardSize ? 15 : 12' src/components/SessionStageBar.tsx
          test "$(grep -c 'size="card"' src/components/SessionCard.tsx)" -eq 1
          grep -q 'className="h-\[10px\] w-full rounded-full bg\[#E7E7E7\]"' src/components/SessionCard.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production Vite build
        run: npx vite build
      - name: Check diff
        run: git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SessionStageBar.tsx src/components/SessionCard.tsx
          git commit -m 'Scope enlarged session stage bar to cards only'
          git push origin main
