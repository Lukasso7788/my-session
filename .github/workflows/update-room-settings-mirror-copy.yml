name: Update Room Settings mirror copy

on:
  push:
    branches: [main]
    paths:
      - scripts/update-room-settings-mirror-copy.mjs
      - .github/workflows/update-room-settings-mirror-copy.yml

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, 'Run Room Settings mirror copy fix')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Room Settings copy
        run: node scripts/update-room-settings-mirror-copy.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/livekit/RoomSettingsModalLiveKit.tsx
          git commit -m "Clarify shared camera mirror setting"
          git push origin HEAD:main
