name: Restore session card occupancy indicators

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-session-card-occupancy-indicators.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore always-visible occupancy indicators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/SessionCard.tsx')
          text = path.read_text()

          old_inline = '''                                    {hasStarted ? peopleInline : null}\n'''
          new_inline = '''                                    {peopleInline}\n'''
          if old_inline not in text:
              raise SystemExit('inline In session gate not found')
          text = text.replace(old_inline, new_inline, 1)

          old_slots = '''                            className={`${hasStarted ? "hidden xl:flex" : "hidden"} items-center gap-5 xl:mr-3 transition-opacity hover:opacity-70`}\n'''
          new_slots = '''                            className="hidden xl:flex items-center gap-5 xl:mr-3 transition-opacity hover:opacity-70"\n'''
          if old_slots not in text:
              raise SystemExit('slots occupied gate not found')
          text = text.replace(old_slots, new_slots, 1)

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production Vite build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SessionCard.tsx
          git commit -m 'Restore session card occupancy indicators' || exit 0
          git push origin main
