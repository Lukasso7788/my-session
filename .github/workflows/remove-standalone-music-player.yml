name: Remove standalone music player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-standalone-music-player.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove standalone player, keep Chrome tab-audio sharing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          app = app.replace('import StandaloneSoundscapePage from "./pages/StandaloneSoundscapePage";\n', '')
          app = app.replace('''  const isStandaloneSoundscape =\n    typeof window !== "undefined" &&\n    window.location.pathname === "/music-player";\n''', '')
          app = app.replace('''\n  if (isStandaloneSoundscape) {\n    return <StandaloneSoundscapePage />;\n  }\n''', '')
          app_path.write_text(app)

          panel_path = Path('src/pages/livekit/RoomSoundscapePanel.tsx')
          panel = panel_path.read_text()
          panel = panel.replace('  ExternalLink,\n', '')
          panel = panel.replace('''\n  const openStandalonePlayer = () => {\n    if (activeId === "custom") return;\n    const trackId = activeId || ROOM_SOUNDSCAPE_OPTIONS[0].id;\n    const params = new URLSearchParams({\n      track: trackId,\n      position: String(Math.max(0, shownPosition)),\n      volume: String(Math.max(0, Math.min(100, volume))),\n      autoplay: playing ? "1" : "0",\n    });\n    window.open(\n      `/music-player?${params.toString()}`,\n      "mysession-music-share",\n      "noopener,noreferrer",\n    );\n  };\n''', '')
          panel = panel.replace('''\n          <button\n            type="button"\n            disabled={activeId === "custom"}\n            onClick={openStandalonePlayer}\n            className="mt-2 flex h-10 w-full items-center justify-center gap-2 rounded-xl border border-[#D8D5D5] bg-white text-[10px] font-semibold text-[#2F2F2F] transition hover:bg-[#F3F1F1] disabled:cursor-not-allowed disabled:opacity-35"\n            title={activeId === "custom" ? "Uploaded tracks cannot be opened in the standalone tab yet" : "Open a standalone music tab for browser tab-audio sharing"}\n          >\n            <ExternalLink className="h-3.5 w-3.5" strokeWidth={1.8} />\n            Open standalone share tab\n          </button>\n          <p className="mt-1.5 px-1 text-[8px] leading-4 text-[#2F2F2F]/40">\n            Share that tab from the room and enable browser tab audio.\n          </p>\n''', '')
          panel_path.write_text(panel)

          standalone = Path('src/pages/StandaloneSoundscapePage.tsx')
          if standalone.exists():
              standalone.unlink()

          room = Path('src/pages/RoomPageLiveKit.tsx').read_text()
          if 'setScreenShareEnabled(true' not in room:
              raise SystemExit('Screen share path not found')
          if 'audio: true' not in room:
              raise SystemExit('Chrome tab-audio sharing is not enabled')

          if 'StandaloneSoundscapePage' in app or 'openStandalonePlayer' in panel or 'Open standalone share tab' in panel:
              raise SystemExit('Standalone player cleanup incomplete')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Production Vite build
        run: npx vite build
      - name: Check diff
        run: git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/App.tsx src/pages/livekit/RoomSoundscapePanel.tsx src/pages/StandaloneSoundscapePage.tsx
          git commit -m 'Remove standalone music player; keep tab audio sharing' || exit 0
          git push origin main
