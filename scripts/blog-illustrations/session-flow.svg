<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Example structure of a MySession focus session</title>
  <desc id="description">A restrained product-style timeline from intentions through focus, check-in, another focus block, and recap.</desc>
  <style>
    text { font-family: Inter, sans-serif; }
    .kicker { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
    .headline { font-size: 40px; font-weight: 700; letter-spacing: -1.5px; }
    .stage { font-size: 17px; font-weight: 700; }
    .time { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .note { font-size: 13px; font-weight: 400; }
  </style>

  <rect width="1200" height="675" fill="#2F2F2F"/>
  <text x="64" y="70" class="kicker" fill="#81DB86">MYSESSION / ROOM RHYTHM 03</text>
  <text x="1136" y="70" text-anchor="end" font-size="18" font-weight="700" fill="#FFFFFF">MySession</text>
  <text x="64" y="140" class="headline" fill="#FFFFFF">Structure that stays out of the way.</text>
  <text x="64" y="176" font-size="15" fill="#B9B9B5">One shared timeline removes the need to renegotiate the next step.</text>

  <rect x="64" y="222" width="1072" height="10" rx="5" fill="#454542"/>
  <rect x="64" y="222" width="83" height="10" rx="5" fill="#A9CAA9"/>
  <rect x="155" y="222" width="389" height="10" rx="5" fill="#81DB86"/>
  <rect x="552" y="222" width="83" height="10" rx="5" fill="#C3C3BE"/>
  <rect x="643" y="222" width="389" height="10" rx="5" fill="#81DB86"/>
  <rect x="1040" y="222" width="96" height="10" rx="5" fill="#A9CAA9"/>

  <line x1="64" y1="282" x2="1136" y2="282" stroke="#4B4B48"/>
  <line x1="64" y1="500" x2="1136" y2="500" stroke="#4B4B48"/>
  <line x1="198" y1="282" x2="198" y2="500" stroke="#4B4B48"/>
  <line x1="494" y1="282" x2="494" y2="500" stroke="#4B4B48"/>
  <line x1="660" y1="282" x2="660" y2="500" stroke="#4B4B48"/>
  <line x1="956" y1="282" x2="956" y2="500" stroke="#4B4B48"/>

  <text x="64" y="321" class="time" fill="#9D9D98">00:00 / 5 MIN</text>
  <text x="64" y="370" class="stage" fill="#FFFFFF">Intentions</text>
  <text x="64" y="400" class="note" fill="#B9B9B5">Name the task.</text>
  <text x="64" y="422" class="note" fill="#B9B9B5">Choose the first</text>
  <text x="64" y="444" class="note" fill="#B9B9B5">visible step.</text>

  <text x="230" y="321" class="time" fill="#81DB86">00:05 / 25 MIN</text>
  <text x="230" y="370" class="stage" fill="#FFFFFF">Focus</text>
  <text x="230" y="400" class="note" fill="#B9B9B5">Quiet visible work.</text>
  <text x="230" y="422" class="note" fill="#B9B9B5">Tasks stay in view.</text>

  <text x="526" y="321" class="time" fill="#9D9D98">00:30 / 5 MIN</text>
  <text x="526" y="370" class="stage" fill="#FFFFFF">Check-in</text>
  <text x="526" y="400" class="note" fill="#B9B9B5">Pause.</text>
  <text x="526" y="422" class="note" fill="#B9B9B5">Reset.</text>
  <text x="526" y="444" class="note" fill="#B9B9B5">Continue.</text>

  <text x="692" y="321" class="time" fill="#81DB86">00:35 / 25 MIN</text>
  <text x="692" y="370" class="stage" fill="#FFFFFF">Focus again</text>
  <text x="692" y="400" class="note" fill="#B9B9B5">Return without</text>
  <text x="692" y="422" class="note" fill="#B9B9B5">replanning the session.</text>

  <text x="988" y="321" class="time" fill="#9D9D98">01:00 / 5 MIN</text>
  <text x="988" y="370" class="stage" fill="#FFFFFF">Recap</text>
  <text x="988" y="400" class="note" fill="#B9B9B5">Record what</text>
  <text x="988" y="422" class="note" fill="#B9B9B5">moved forward.</text>

  <text x="64" y="558" class="note" fill="#8E8E89">Example room timeline</text>
  <text x="1136" y="558" text-anchor="end" class="time" fill="#81DB86">65 MIN TOTAL</text>
  <rect x="64" y="594" width="1072" height="44" fill="#373734"/>
  <text x="88" y="621" class="note" fill="#D0D0CC">The timeline is visible to everyone. The work remains yours.</text>
</svg>
