<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>VIRTUAL COWORKING — MySession editorial cover</title>
  <style>
    @font-face { font-family: Inter; src: url("../../public/fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
    @font-face { font-family: Inter; src: url("../../public/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; }
    @font-face { font-family: Inter; src: url("../../public/fonts/Inter-ExtraBold.woff2") format("woff2"); font-weight: 800; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: Inter, Arial, sans-serif; }
    .cover {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: var(--ink);
      background: var(--background);
    }
    .cover[data-theme="night"] { --background: #142b52; --ink: #f8fbff; --muted: #c7d9f6; --accent: #75a9ff; --line: #4d6c9c; }
    .cover[data-theme="paper"] { --background: #f9f6ef; --ink: #1d2d45; --muted: #5f6d80; --accent: #3d77dd; --line: #c9d4e3; }
    .cover[data-theme="sky"] { --background: #eaf2ff; --ink: #182a49; --muted: #5c7194; --accent: #3d77dd; --line: #aec8ef; }
    .cover[data-theme="indigo"] { --background: #242c59; --ink: #fcfdff; --muted: #d2daf5; --accent: #9ab7ff; --line: #6877b1; }
    .cover[data-theme="mist"] { --background: #f1f4f8; --ink: #1d2b42; --muted: #5b6d84; --accent: #477dd7; --line: #bfd0e7; }
    .photo {
      position: absolute;
      left: 610px;
      top: 28px;
      width: 562px;
      height: 574px;
      overflow: hidden;
      border-radius: 28px;
      background: #b5c8dc;
    }
    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--photo-position, 50% 50%);
    }
    .cover[data-theme="night"] { --photo-position: 50% 50%; }
    .cover[data-theme="paper"] { --photo-position: 55% 28%; }
    .cover[data-theme="sky"] { --photo-position: 50% 50%; }
    .cover[data-theme="indigo"] { --photo-position: 58% 50%; }
    .cover[data-theme="mist"] { --photo-position: 23% 50%; }
    .brand {
      position: absolute;
      top: 39px;
      left: 54px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .brand-mark { display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: var(--accent); transform: rotate(45deg); }
    .copy { position: absolute; left: 54px; top: 154px; width: 530px; }
    .category { display: flex; align-items: center; gap: 12px; color: var(--accent); font-size: 15px; font-weight: 800; letter-spacing: 0.14em; }
    .category::before { content: ""; display: block; width: 28px; height: 3px; border-radius: 3px; background: currentColor; }
    h1 { margin: 22px 0 0; max-width: 525px; font-size: 68px; font-weight: 800; line-height: 0.99; letter-spacing: -0.065em; text-wrap: balance; }
    .cover[data-theme="indigo"] h1 { font-size: 61px; }
    .subline { margin-top: 25px; max-width: 500px; color: var(--muted); font-size: 22px; font-weight: 400; line-height: 1.3; letter-spacing: -0.015em; }
    .footer { position: absolute; left: 54px; right: 624px; bottom: 49px; display: flex; align-items: center; gap: 13px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; }
    .footer-line { flex: 1; height: 1px; background: var(--line); }
    .folio { color: var(--accent); font-size: 16px; font-weight: 800; letter-spacing: 0; }
    .cover[data-theme="paper"] .photo { border-radius: 220px 26px 26px 26px; }
    .cover[data-theme="sky"] .photo { border-radius: 26px 26px 220px 26px; }
    .cover[data-theme="indigo"] .photo { border-radius: 26px 180px 26px 26px; }
    .cover[data-theme="mist"] .photo { border-radius: 26px 26px 26px 180px; }
  </style>
</head>
<body>
  <main class="cover" data-theme="night" aria-label="VIRTUAL COWORKING cover">
    <div class="photo"><img src="photos/virtual-coworking.jpg" alt="Overhead view of a laptop video call while a person types at a desk"></div>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>MySession</div>
    <div class="copy">
      <div class="category">VIRTUAL COWORKING</div>
      <h1>Work apart. Focus together.</h1>
      <div class="subline">Your task, a shared rhythm.</div>
    </div>
    <div class="footer"><span>ROOM GUIDE</span><span class="footer-line"></span><span class="folio">07</span></div>
  </main>
</body>
</html>
