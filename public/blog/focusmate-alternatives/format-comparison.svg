<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Scheduled one-to-one and group focus formats compared</title>
  <desc id="description">A modern side-by-side comparison of scheduled one-to-one Focusmate sessions and group or always-open MySession rooms.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -1px; }
    .cardTitle { font-size: 25px; font-weight: 700; letter-spacing: -.5px; }
    .body { font-size: 15px; font-weight: 450; }
    .item { font-size: 18px; font-weight: 650; }
    .caption { font-size: 13px; font-weight: 450; }
  </style>

  <rect width="1200" height="675" rx="40" fill="#F4F5F3"/>
  <circle cx="78" cy="68" r="7" fill="#81DB86"/>
  <text x="98" y="73" class="eyebrow" fill="#2F2F2F">MYSESSION FIELD GUIDE</text>
  <text x="1114" y="73" text-anchor="end" font-size="18" font-weight="800" fill="#2F2F2F">MySession</text>

  <text x="64" y="136" class="title" fill="#2F2F2F">Choose the accountability that gets you started.</text>
  <text x="64" y="168" class="body" fill="#757575">Both formats create presence. They remove different kinds of friction.</text>

  <rect x="64" y="204" width="520" height="407" rx="32" fill="#FFFFFF"/>
  <rect x="616" y="204" width="520" height="407" rx="32" fill="#2F2F2F"/>

  <rect x="96" y="236" width="48" height="48" rx="15" fill="#F0F0EF"/>
  <text x="120" y="267" text-anchor="middle" font-size="15" font-weight="750" fill="#6C6C6C">01</text>
  <text x="164" y="255" class="cardTitle" fill="#2F2F2F">Scheduled 1:1</text>
  <text x="164" y="280" class="caption" fill="#777777">One partner. One appointment.</text>

  <rect x="648" y="236" width="48" height="48" rx="15" fill="#81DB86"/>
  <text x="672" y="267" text-anchor="middle" font-size="15" font-weight="750" fill="#204F25">02</text>
  <text x="716" y="255" class="cardTitle" fill="#FFFFFF">Group + 24/7</text>
  <text x="716" y="280" class="caption" fill="#BEBEBE">A room when you need one.</text>

  <circle cx="112" cy="337" r="15" fill="#F0F0EF"/>
  <path d="M106 337l4 4 8-9" fill="none" stroke="#5F5F5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="144" y="333" class="item" fill="#2F2F2F">Book a time</text>
  <text x="144" y="354" class="caption" fill="#777777">Commit before motivation arrives.</text>

  <circle cx="112" cy="410" r="15" fill="#F0F0EF"/>
  <path d="M106 410l4 4 8-9" fill="none" stroke="#5F5F5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="144" y="406" class="item" fill="#2F2F2F">Meet one partner</text>
  <text x="144" y="427" class="caption" fill="#777777">Direct, personal accountability.</text>

  <circle cx="112" cy="483" r="15" fill="#F0F0EF"/>
  <path d="M106 483l4 4 8-9" fill="none" stroke="#5F5F5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="144" y="479" class="item" fill="#2F2F2F">Finish together</text>
  <text x="144" y="500" class="caption" fill="#777777">A clear start-work-finish ritual.</text>

  <circle cx="664" cy="337" r="15" fill="#81DB86"/>
  <path d="M658 337l4 4 8-9" fill="none" stroke="#204F25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="696" y="333" class="item" fill="#FFFFFF">Start now or schedule</text>
  <text x="696" y="354" class="caption" fill="#BEBEBE">Choose the lowest-friction entry.</text>

  <circle cx="664" cy="410" r="15" fill="#81DB86"/>
  <path d="M658 410l4 4 8-9" fill="none" stroke="#204F25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="696" y="406" class="item" fill="#FFFFFF">Work around a group</text>
  <text x="696" y="427" class="caption" fill="#BEBEBE">Visible, without intense 1:1 pressure.</text>

  <circle cx="664" cy="483" r="15" fill="#81DB86"/>
  <path d="M658 483l4 4 8-9" fill="none" stroke="#204F25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="696" y="479" class="item" fill="#FFFFFF">Keep structure in one room</text>
  <text x="696" y="500" class="caption" fill="#BEBEBE">Tasks, stages, check-ins, chat and music.</text>

  <rect x="96" y="544" width="456" height="43" rx="14" fill="#F4F5F3"/>
  <text x="324" y="571" text-anchor="middle" font-size="14" font-weight="650" fill="#5F5F5F">Best for: showing up to a commitment</text>
  <rect x="648" y="544" width="456" height="43" rx="14" fill="#3A3A3A"/>
  <text x="876" y="571" text-anchor="middle" font-size="14" font-weight="650" fill="#AEE8B2">Best for: starting with less friction</text>
</svg>
