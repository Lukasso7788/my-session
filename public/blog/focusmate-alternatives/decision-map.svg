<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Decision map for choosing a virtual coworking format</title>
  <desc id="description">A decision map connecting common focus problems to scheduled one-to-one sessions, always-open rooms, quiet groups, and structured sessions.</desc>
  <rect width="1200" height="675" rx="40" fill="#f7f7f7"/>
  <text x="600" y="76" text-anchor="middle" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Where does your focus usually break?</text>
  <text x="600" y="112" text-anchor="middle" fill="#777" font-family="Inter,Arial,sans-serif" font-size="16">Start with the obstacle, then choose the format.</text>

  <rect x="416" y="151" width="368" height="88" rx="24" fill="#2f2f2f"/>
  <text x="600" y="188" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">What stops you from starting?</text>
  <text x="600" y="216" text-anchor="middle" fill="#cfcfcf" font-family="Inter,Arial,sans-serif" font-size="14">Pick the closest answer</text>

  <path d="M600 239v46M600 285H176v54M600 285H458v54M600 285h142v54M600 285h424v54" fill="none" stroke="#c9c9c9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="62" y="339" width="228" height="104" rx="20" fill="#ffffff"/>
  <circle cx="96" cy="374" r="12" fill="#81db86"/>
  <text x="120" y="381" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">I skip commitments</text>
  <text x="88" y="414" fill="#777" font-family="Inter,Arial,sans-serif" font-size="14">Use a booked appointment.</text>

  <rect x="344" y="339" width="228" height="104" rx="20" fill="#ffffff"/>
  <circle cx="378" cy="374" r="12" fill="#81db86"/>
  <text x="402" y="381" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">I need to start now</text>
  <text x="370" y="414" fill="#777" font-family="Inter,Arial,sans-serif" font-size="14">Remove scheduling friction.</text>

  <rect x="628" y="339" width="228" height="104" rx="20" fill="#ffffff"/>
  <circle cx="662" cy="374" r="12" fill="#81db86"/>
  <text x="686" y="381" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">1:1 feels intense</text>
  <text x="654" y="414" fill="#777" font-family="Inter,Arial,sans-serif" font-size="14">Spread attention across a group.</text>

  <rect x="910" y="339" width="228" height="104" rx="20" fill="#ffffff"/>
  <circle cx="944" cy="374" r="12" fill="#81db86"/>
  <text x="968" y="381" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">I lose direction</text>
  <text x="936" y="414" fill="#777" font-family="Inter,Arial,sans-serif" font-size="14">Add stages and check-ins.</text>

  <path d="M176 443v55M458 443v55M742 443v55M1024 443v55" stroke="#c9c9c9" stroke-width="4" stroke-linecap="round"/>
  <rect x="62" y="498" width="228" height="104" rx="20" fill="#eaf8eb"/>
  <text x="176" y="540" text-anchor="middle" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Scheduled 1:1</text>
  <text x="176" y="569" text-anchor="middle" fill="#557058" font-family="Inter,Arial,sans-serif" font-size="14">A partner expects you</text>

  <rect x="344" y="498" width="228" height="104" rx="20" fill="#eaf8eb"/>
  <text x="458" y="540" text-anchor="middle" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">24/7 focus room</text>
  <text x="458" y="569" text-anchor="middle" fill="#557058" font-family="Inter,Arial,sans-serif" font-size="14">Enter when ready</text>

  <rect x="628" y="498" width="228" height="104" rx="20" fill="#eaf8eb"/>
  <text x="742" y="540" text-anchor="middle" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Quiet group room</text>
  <text x="742" y="569" text-anchor="middle" fill="#557058" font-family="Inter,Arial,sans-serif" font-size="14">Accountability, less pressure</text>

  <rect x="910" y="498" width="228" height="104" rx="20" fill="#eaf8eb"/>
  <text x="1024" y="540" text-anchor="middle" fill="#2f2f2f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Staged session</text>
  <text x="1024" y="569" text-anchor="middle" fill="#557058" font-family="Inter,Arial,sans-serif" font-size="14">Focus, break, recap</text>
</svg>
