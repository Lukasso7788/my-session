<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Example structure of a MySession focus session</title>
  <desc id="description">A modern session timeline moving from intentions through focus, a check-in, another focus block, and a final recap.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -1px; }
    .stage { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
    .caption { font-size: 13px; font-weight: 450; }
    .time { font-size: 12px; font-weight: 650; }
  </style>

  <rect width="1200" height="675" rx="40" fill="#2F2F2F"/>
  <circle cx="78" cy="68" r="7" fill="#81DB86"/>
  <text x="98" y="73" class="eyebrow" fill="#FFFFFF">A STRUCTURED ROOM</text>
  <text x="1114" y="73" text-anchor="end" font-size="18" font-weight="800" fill="#FFFFFF">MySession</text>
  <text x="64" y="136" class="title" fill="#FFFFFF">One shared rhythm. Fewer decisions.</text>
  <text x="64" y="168" font-size="15" fill="#BDBDBD">A timeline keeps a longer work block moving without another planning tool.</text>

  <rect x="64" y="211" width="1072" height="48" rx="16" fill="#3A3A3A"/>
  <rect x="72" y="219" width="112" height="32" rx="10" fill="#B9DCFF"/>
  <rect x="192" y="219" width="330" height="32" rx="10" fill="#81DB86"/>
  <rect x="530" y="219" width="130" height="32" rx="10" fill="#FFD69A"/>
  <rect x="668" y="219" width="330" height="32" rx="10" fill="#81DB86"/>
  <rect x="1006" y="219" width="122" height="32" rx="10" fill="#D9C9FF"/>

  <text x="128" y="238" text-anchor="middle" class="time" fill="#315F92">5 MIN</text>
  <text x="357" y="238" text-anchor="middle" class="time" fill="#204F25">25 MIN</text>
  <text x="595" y="238" text-anchor="middle" class="time" fill="#7A5625">5 MIN</text>
  <text x="833" y="238" text-anchor="middle" class="time" fill="#204F25">25 MIN</text>
  <text x="1067" y="238" text-anchor="middle" class="time" fill="#61458B">5 MIN</text>

  <rect x="64" y="292" width="160" height="264" rx="28" fill="#F4F8FC"/>
  <rect x="244" y="292" width="286" height="264" rx="28" fill="#EAF8EB"/>
  <rect x="550" y="292" width="160" height="264" rx="28" fill="#FFF4E4"/>
  <rect x="730" y="292" width="286" height="264" rx="28" fill="#EAF8EB"/>
  <rect x="1036" y="292" width="100" height="264" rx="28" fill="#F4EFFF"/>

  <rect x="88" y="316" width="42" height="42" rx="13" fill="#B9DCFF"/>
  <path d="M100 337h18m-9-9v18" stroke="#315F92" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="396" class="stage" fill="#2F2F2F">Intentions</text>
  <text x="88" y="429" class="caption" fill="#637887">Name the task.</text>
  <text x="88" y="450" class="caption" fill="#637887">Choose the first</text>
  <text x="88" y="471" class="caption" fill="#637887">visible step.</text>

  <rect x="268" y="316" width="42" height="42" rx="13" fill="#81DB86"/>
  <path d="M279 337l7 7 13-16" fill="none" stroke="#204F25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268" y="396" class="stage" fill="#2F2F2F">Focus</text>
  <text x="268" y="429" class="caption" fill="#557058">Quiet visible work.</text>
  <text x="268" y="450" class="caption" fill="#557058">Tasks stay in view;</text>
  <text x="268" y="471" class="caption" fill="#557058">the room stays calm.</text>
  <rect x="268" y="505" width="119" height="30" rx="10" fill="#D7F0D9"/>
  <text x="327" y="525" text-anchor="middle" class="time" fill="#3D7B43">DEEP WORK</text>

  <rect x="574" y="316" width="42" height="42" rx="13" fill="#FFD69A"/>
  <path d="M584 329h21v16h-21zM605 333h6v8h-6" fill="none" stroke="#7A5625" stroke-width="3" stroke-linejoin="round"/>
  <text x="574" y="396" class="stage" fill="#2F2F2F">Check-in</text>
  <text x="574" y="429" class="caption" fill="#826B4A">Pause.</text>
  <text x="574" y="450" class="caption" fill="#826B4A">Reset.</text>
  <text x="574" y="471" class="caption" fill="#826B4A">Continue.</text>

  <rect x="754" y="316" width="42" height="42" rx="13" fill="#81DB86"/>
  <path d="M765 337l7 7 13-16" fill="none" stroke="#204F25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="754" y="396" class="stage" fill="#2F2F2F">Focus again</text>
  <text x="754" y="429" class="caption" fill="#557058">Return without</text>
  <text x="754" y="450" class="caption" fill="#557058">renegotiating the</text>
  <text x="754" y="471" class="caption" fill="#557058">whole plan.</text>
  <rect x="754" y="505" width="119" height="30" rx="10" fill="#D7F0D9"/>
  <text x="813" y="525" text-anchor="middle" class="time" fill="#3D7B43">KEEP GOING</text>

  <rect x="1058" y="316" width="42" height="42" rx="13" fill="#D9C9FF"/>
  <path d="M1068 328h21v19h-21zM1073 334h11m-11 7h8" fill="none" stroke="#61458B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1058" y="396" class="stage" fill="#2F2F2F">Recap</text>
  <text x="1058" y="429" class="caption" fill="#76678F">Record</text>
  <text x="1058" y="450" class="caption" fill="#76678F">what moved</text>
  <text x="1058" y="471" class="caption" fill="#76678F">forward.</text>

  <text x="64" y="610" class="caption" fill="#929292">Example timeline · Room hosts can use a different structure.</text>
  <rect x="1000" y="588" width="136" height="36" rx="12" fill="#3A3A3A"/>
  <text x="1068" y="611" text-anchor="middle" font-size="12" font-weight="650" fill="#AEE8B2">65 MIN SESSION</text>
</svg>
